# Local no-GPU development override.
#
# container.sh automatically layers this file over docker-compose.yml.
# It lets the main Cyclo UI/data container run on machines without the
# NVIDIA Container Toolkit. Policy containers (lerobot/groot) still need GPU.
services:
  cyclo_intelligence:
    runtime: runc
    deploy:
      resources:
        reservations:
          devices: !reset []

  # Live-edit the LeRobot library (cyclo_brain/policy/lerobot/lerobot submodule)
  # without rebuilding the image: mount the source tree at its canonical
  # in-image location (/lerobot, where the Dockerfile COPYs it) and put its
  # src/ ahead of the baked site-packages copy on the import path. The s6 run
  # scripts append a pre-existing PYTHONPATH. Code is imported once per process:
  # after editing, use the UI "Restart" (docker restart) and LOAD again.
  # Recreate the container ONCE after adding this (mounts bind at creation).
  lerobot:
    environment:
      - PYTHONPATH=/lerobot/src
    volumes:
      - ../cyclo_brain/policy/lerobot/lerobot:/lerobot:ro

  # Live-edit the Isaac-GR00T library (cyclo_brain/policy/groot/Isaac-GR00T
  # submodule). The image installs it EDITABLE at /gr00t, so no PYTHONPATH change
  # is needed -- but /gr00t also holds the container's .venv, so mount ONLY the
  # gr00t/ package dir, never the whole tree. groot_engine/ and runtime/ are
  # already mounted by the base compose file. Restart the backend after edits;
  # recreate the container ONCE after adding this (mounts bind at creation).
  groot:
    environment:
      # Request the next action chunk earlier (buffered time < margin + measured
      # inference latency) to avoid stalls at chunk boundaries. Default 0.2.
      - REFILL_MARGIN_S=0.4
    volumes:
      - ../cyclo_brain/policy/groot/Isaac-GR00T/gr00t:/gr00t/gr00t:ro
